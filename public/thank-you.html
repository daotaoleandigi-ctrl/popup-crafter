<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Đăng ký thành công</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      .box {
        text-align: center;
        padding: 32px;
      }
      .badge {
        height: 56px;
        width: 56px;
        border-radius: 9999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        color: #fff;
        background: linear-gradient(135deg, #7c3aed, #a78bfa);
        box-shadow: 0 10px 20px -5px rgba(124, 58, 237, 0.4);
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        font-weight: 800;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        margin: 0;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="badge">&#10003;</div>
      <h1>Đăng ký thành công</h1>
      <p>Cảm ơn bạn, có thể đóng trang này.</p>
    </div>
    <!--
      Trang cảm ơn trung gian dành cho popup cào quà.
      Cách dùng:
        1. Host file này tại domain của bạn, ví dụ: https://ten-mien-cua-ban.com/thank-you.html
        2. Vào cấu hình Form (GHL) -> thiết lập "Redirect URL" / "Thank-you page"
           trỏ tới đường dẫn tuyệt đối của file này.
        3. Khi người dùng submit form bên trong iframe popup, form sẽ redirect
           tới trang này. Đoạn script dưới đây gửi postMessage về popup (cha),
           popup bắt được sự kiện "form:submit" và tự chuyển sang Bước 3 (Cảm ơn).
      Lưu ý: dùng '*' làm targetOrigin để hoạt động với mọi domain gắn popup.
    -->
    <script>
      (function () {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ event: "form:submit" }, "*");
          }
        } catch (e) {}
      })();
    </script>
  </body>
</html>
